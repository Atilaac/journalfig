site_name: journalfig
site_description: Publication-ready matplotlib themes for Nature, APS, and Elsevier journals
site_url: https://Atilaac.github.io/journalfig/
repo_url: https://github.com/Atilaac/journalfig
repo_name: Atilaac/journalfig
copyright: Copyright &copy; Achraf Atila

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Guide: guide.md
  - Specifications: specifications.md
  - API reference: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            docstring_section_style: table
            show_root_heading: true
            show_source: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            heading_level: 2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
