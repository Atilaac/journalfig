[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "journalfig"
dynamic = ["version"]
description = "Publication-ready matplotlib themes for twelve scientific publishers"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Achraf Atila", email = "achraf.atila@bam.de" }]
maintainers = [{ name = "Achraf Atila", email = "achraf.atila@bam.de" }]
keywords = [
    "matplotlib",
    "publication",
    "figures",
    "journal",
    "nature",
    "aps",
    "elsevier",
    "scientific-visualization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Framework :: Matplotlib",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = ["matplotlib>=3.8"]

[project.scripts]
journalfig = "journalfig._cli:main"

[project.urls]
Homepage = "https://github.com/Atilaac/journalfig"
Documentation = "https://atilaac.github.io/journalfig/"
Repository = "https://github.com/Atilaac/journalfig"
Issues = "https://github.com/Atilaac/journalfig/issues"
Changelog = "https://github.com/Atilaac/journalfig/releases"

[project.optional-dependencies]
# pillow arrives with matplotlib, but the TIFF-compression test imports it directly, so it is declared.
# numpy is not used by the package itself -- only by demo.py, which CI smoke-runs. scipy is used by the
# curve-fitting example notebook, which CI executes. Neither is a runtime dependency of the package.
test = ["pytest>=7", "coverage[toml]>=7", "pillow>=9", "numpy>=1.24", "nbval>=0.11", "ipykernel>=6", "pytest-mpl>=0.17", "scipy>=1.10", "cmcrameri>=1.9"]
# mkdocs-jupyter renders examples/*.ipynb as the Tutorials section, reached through the
# docs/tutorials symlink. It must be declared here or the docs CI job fails on a missing plugin.
docs = ["mkdocs>=1.6", "mkdocs-material>=9", "mkdocstrings[python]>=0.25", "mkdocs-jupyter>=0.24"]
# Scientific colour maps (Crameri). Optional: the heatmap notebook falls back to matplotlib's
# built-ins when it is absent, and the package itself never imports it.
examples = ["cmcrameri>=1.9"]
dev = [
    "journalfig[test,docs,examples]",
    "ruff>=0.4",
    "mypy>=1.11",
    "pre-commit>=3",
]

[tool.hatch.version]
path = "src/journalfig/__init__.py"

[tool.hatch.build.targets.wheel]
# packages= already ships styles/*.mplstyle and py.typed. A force-include of the same directory would
# also write it to the site-packages root, where it shadows the finder an editable install relies on
# and turns `import journalfig` into an empty namespace package.
packages = ["src/journalfig"]

[tool.hatch.build.targets.sdist]
# The gallery and the executed notebook are ~4.7 MB of binaries; they belong in the repository, not in
# every download of the package.
include = ["src", "tests", "conftest.py", "README.md", "LICENSE", "CITATION.cff"]

[tool.ruff]
line-length = 120
# The notebooks ship executed, and reformatting their cells would desync the source from the outputs
# already rendered beneath them. They are documentation, not linted modules. Scoped to the notebooks so
# that plain scripts under examples/ -- the data generator -- are still checked.
extend-exclude = ["examples/*.ipynb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
# PLW1514 is preview-only, which is why `preview` is on; it adds no other findings to this codebase.
# It exists here because text I/O without an explicit encoding is the one bug class that passes on
# Linux and macOS and fails only on Windows: `read_text()` uses the locale encoding, which is UTF-8
# on the developer machines and cp1252 on a Windows runner, so any non-ASCII character in a file the
# package reads back -- an em dash in docs/specifications.md -- decodes to mojibake there and nowhere
# else. That failed the whole Windows matrix while every other job passed.
preview = true
select = ["E", "F", "I", "N", "UP", "B", "W", "PLW1514"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
# The package ships py.typed, which tells downstream checkers to trust these annotations. Without a
# checker of our own that was an author's promise; strict mode makes it a verified one.
# matplotlib ships py.typed too, so no ignore_missing_imports is needed -- if that stops being true,
# fix the import rather than silencing it.
files = ["src/journalfig"]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests", "src/journalfig"]
addopts = "--doctest-modules"
# Turns an unexpected compliance warning into a test failure. Naming the category here makes pytest
# import journalfig while parsing the config, which is before pytest-cov would start measuring --
# so coverage is collected with `coverage run -m pytest` instead -- pytest-cov starts measuring too
# late and under-reports by ~27 points. See CONTRIBUTING.md.
filterwarnings = ["error::journalfig.JournalFigWarning"]

[tool.coverage.run]
source = ["src/journalfig"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
