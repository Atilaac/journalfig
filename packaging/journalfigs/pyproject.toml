# Companion package that reserves the plural spelling on PyPI and forwards it to journalfig.
# It is built and released separately from the main package: `cd packaging/journalfigs && python -m build`.
# Its version tracks journalfig's: scripts/set_version.py rewrites it during a release, and
# tests/test_version_consistency.py fails if the two ever disagree. That means a release bumps this
# package even when the alias code is unchanged -- accepted, so that no version is ever edited by hand.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "journalfigs"
version = "0.5.0"
description = "Alias for journalfig: installing this installs and re-exports the real package"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Achraf Atila", email = "achraf.atila@bam.de" }]
dependencies = ["journalfig>=0.1"]

[project.urls]
Homepage = "https://github.com/Atilaac/journalfig"

[tool.hatch.build.targets.wheel]
packages = ["journalfigs"]
