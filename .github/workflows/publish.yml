name: Publish

# Ships a release to PyPI. Triggered by *publishing* a GitHub Release, not by pushing a tag: the tag is
# created by version-bump.yml the moment the bump pull request merges, and a tag alone should not be
# able to publish. Publishing the draft is the human gate, and it is the last reversible moment -- a
# PyPI upload cannot be replaced, only yanked.
#
# Authentication is PyPI Trusted Publishing (OIDC) -- no API token is stored in this repository.
# Configured once at https://pypi.org/manage/account/publishing/ with:
#   owner Atilaac, repository journalfig, workflow publish.yml, environment pypi
#
# To release, see .github/workflows/version-bump.yml. Nothing here needs a version typed by hand.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release event checks out the tagged commit, which is the bump commit -- the first commit
          # whose __version__ matches the tag.
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      - name: Verify the tag matches the packaged version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          tag = os.environ["TAG"].lstrip("v")
          init = pathlib.Path("src/journalfig/__init__.py").read_text(encoding="utf-8")
          version = re.search(r'__version__ = "([^"]+)"', init).group(1)
          if tag != version:
              sys.exit(f"tag {tag} does not match __version__ {version} -- did the bump pull request merge?")
          print(f"tag and __version__ agree: {version}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke-test:
    # The suite runs against the source tree; this runs against the artefact that is about to be
    # uploaded. It is the only check that would catch a packaging fault -- a missing subpackage, an
    # unshipped stylesheet, a py.typed left out of the wheel -- which no source-tree test can see.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: pip install dist/*.whl
      - name: Import, build a figure, and check it
        run: |
          python - <<'PY'
          import matplotlib
          matplotlib.use("Agg")
          import journalfig as jf

          print("journalfig", jf.__version__)
          assert len(jf.JOURNALS) >= 12, jf.JOURNALS

          # The stylesheets and spec tables are package data; a wheel that omitted them imports fine and
          # only fails here.
          with jf.context("nature"):
              fig, ax = jf.subplots("nature", width="single")
              ax.plot([0, 1], [0, 1])
              ax.set_xlabel("q"); ax.set_ylabel("S(q)")
              width_mm = fig.get_size_inches()[0] * 25.4
              assert abs(width_mm - 89.0) < 0.01, width_mm
              assert jf.check(fig, journal="nature") == [], jf.check(fig, journal="nature")

          import importlib.resources as r
          assert (r.files("journalfig") / "py.typed").is_file(), "py.typed missing from the wheel"
          print("smoke test OK")
          PY
      - run: journalfig journals

  publish:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
