name: Publish

# Releases are cut by pushing a tag: `git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0`.
# Authentication is PyPI Trusted Publishing (OIDC) -- no API token is stored in this repository.
# Configure the publisher once at https://pypi.org/manage/account/publishing/ with:
#   owner Atilaac, repository journalfig, workflow publish.yml, environment pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Verify the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          init = pathlib.Path("src/journalfig/__init__.py").read_text()
          version = re.search(r'__version__ = "([^"]+)"', init).group(1)
          if tag != version:
              sys.exit(f"tag {tag} does not match __version__ {version}")
          print(f"tag and __version__ agree: {version}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
