name: Docs

# Publishes the MkDocs site to GitHub Pages. ci.yml already builds it with --strict on every pull
# request, which is the gate; this only deploys what main already proved buildable.
#
# One-time setup, already done: Settings -> Pages -> Source must be "GitHub Actions". Left on the default
# "Deploy from a branch (main /docs)" it is not merely inert -- GitHub's own pages-build-deployment runs
# Jekyll over the raw markdown in docs/ on every push to main and races this workflow for the deployment
# lock, so the published site flips between the two and this workflow intermittently fails with
# "Deployment request failed ... due to in progress deployment".
#   gh api -X PUT repos/Atilaac/journalfig/pages -f 'build_type=workflow'   # POST only if no site exists
#
# The site is served at https://aatila.com/journalfig/ -- aatila.com is the account-level Pages domain, so
# the site_url in mkdocs.yml (atilaac.github.io) 301s here. Deliberate; canonical links point at the 301.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; the deploy job asks for exactly what it needs and nothing more.
permissions:
  contents: read

# One deploy at a time, and never cancel one midway -- a half-finished deploy would leave the published
# site inconsistent, unlike a cancelled test run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
