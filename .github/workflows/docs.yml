name: Docs

# Publishes the MkDocs site to GitHub Pages. ci.yml already builds it with --strict on every pull
# request, which is the gate; this only deploys what main already proved buildable.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions". Without it the deploy step fails with
# a 404, because there is no Pages site to deploy to.
#   gh api -X POST repos/Atilaac/journalfig/pages -f 'build_type=workflow'

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; the deploy job asks for exactly what it needs and nothing more.
permissions:
  contents: read

# One deploy at a time, and never cancel one midway -- a half-finished deploy would leave the published
# site inconsistent, unlike a cancelled test run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
