# Release Drafter keeps a draft GitHub Release up to date as pull requests merge into main. The draft
# *is* the changelog for this project -- there is no CHANGELOG.md -- so a merged PR's title is what a
# user will read, and it should say what changed rather than what was done to the code.
#
# Categories are ordered by what a reader of this package needs to know first. "Specification changes"
# is top because a moved width or font size resizes every figure a user renders and can flip a
# `journalfig check` verdict, which no other kind of change here does.
#
# The labels below must exist in the repository before the drafter can apply them. One-time setup:
#
#   gh label create breaking      --color d73a4a --description "Removes or changes existing behaviour"
#   gh label create specification --color 5319e7 --description "A publisher-stated number changed"
#   gh label create journal       --color 0e8a16 --description "Adds or extends a journal theme"
#   gh label create feature       --color a2eeef --description "New capability"
#   gh label create bug           --color d73a4a --description "Something behaved incorrectly"
#   gh label create documentation --color 0075ca --description "Docs, docstrings, examples"
#   gh label create maintenance   --color cfd3d7 --description "CI, packaging, tests, tooling"
#   gh label create dependencies  --color 0366d6 --description "Dependency bumps"
#   gh label create skip-changelog --color ededed --description "Keep out of the release notes"
#
# Release control. `release` cuts a release when its pull request merges; the other three override the
# version the labels above would have resolved to, and are only needed when that resolution is wrong:
#
#   gh label create release       --color 0e8a16 --description "Merging this PR cuts a release"
#   gh label create major         --color b60205 --description "Force a MAJOR bump (0.x -> 1.0.0)"
#   gh label create minor         --color fbca04 --description "Force a MINOR bump"
#   gh label create patch         --color c2e0c6 --description "Force a PATCH bump"
#
# `bug`, `documentation`, `enhancement` and `dependencies` are GitHub defaults and already exist;
# `enhancement` is accepted as a synonym of `feature` for that reason. `specification` exists if the
# spec-correction issue template has been used.

name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "📐 Specification changes"
    labels: [specification]
  - title: "⚠️ Breaking changes"
    labels: [breaking]
  - title: "📰 Journals"
    labels: [journal]
  - title: "✨ Added"
    labels: [feature, enhancement]
  - title: "🐛 Fixed"
    labels: [bug]
  - title: "📚 Documentation"
    labels: [documentation]
  - title: "🔧 Maintenance"
    labels: [maintenance]
  - title: "⬆️ Dependencies"
    labels: [dependencies]

exclude-labels: [skip-changelog]

# The resolver encodes the versioning rules in CONTRIBUTING.md, under the 0.x mapping the project is
# currently on: anything that would be a major bump after 1.0 is a minor bump now. A specification
# change is minor at minimum and never a patch -- users pin against it.
#
# `major`, `minor` and `patch` are manual overrides, applied by hand when the automatic resolution is
# wrong. They are listed here so this file stays the single description of how a version is chosen, but
# note that the override is NOT enforced by Release Drafter: its precedence is fixed major > minor >
# patch, so `patch` on a pull request that also carries `feature` still resolves to minor here. Genuine
# override -- including lowering a bump -- is resolved in version-bump.yml, which then corrects this
# draft's tag to match. Applying `major` while the project is on 0.x means 1.0.0; that is a deliberate
# act, not a routine one.
version-resolver:
  major:
    labels: [major]
  minor:
    labels: [minor, breaking, specification, journal, feature, enhancement]
  patch:
    labels: [patch, bug, documentation, maintenance, dependencies]
  default: patch

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'
no-changes-template: "- No user-facing changes."

template: |
  $CHANGES

  **Full diff**: https://github.com/Atilaac/journalfig/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

# Applied on every pull request so the draft is categorised and the next version resolves without
# anyone remembering to label by hand. A label added manually is never removed by this.
autolabeler:
  - label: specification
    files:
      - "src/journalfig/_specs.py"
      - "src/journalfig/styles/*.mplstyle"
      - "docs/specifications.md"
  - label: documentation
    files:
      - "docs/**/*"
      - "*.md"
      - "examples/**/*"
      - "mkdocs.yml"
  - label: maintenance
    files:
      - ".github/**/*"
      - "tests/**/*"
      - "packaging/**/*"
      - ".pre-commit-config.yaml"
  - label: dependencies
    files:
      - "pyproject.toml"
  - label: bug
    branch: ["/^fix\\/.+/"]
    title: ["/^fix(\\(.+\\))?:/i"]
  - label: feature
    branch: ["/^feat\\/.+/"]
    title: ["/^feat(\\(.+\\))?:/i"]
  - label: breaking
    title: ["/^[a-z]+(\\(.+\\))?!:/i"]
